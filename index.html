<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARKSHELL | CHAT</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main: #00ff00; --bg: #050505; --card: #111; }
        body { background: var(--bg); color: #eee; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; }
        .section { display: none; padding: 20px; }
        .section.active { display: block; }
        .navbar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--main); }
        .nav-item { color: #888; cursor: pointer; text-align: center; font-size: 12px; }
        .nav-item.active { color: var(--main); }
        #chat-box { height: 70vh; overflow-y: auto; background: #000; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 14px; position: relative; }
        .msg.sent { align-self: flex-end; background: var(--main); color: #000; }
        .msg.received { align-self: flex-start; background: #222; color: #fff; }
        .verified-badge { color: #3897f0; margin-right: 4px; font-size: 14px; }
        .input-area { display: flex; gap: 5px; margin-top: 10px; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; flex: 1; outline: none; }
        button { background: var(--main); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .profile-card { background: var(--card); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #333; }
    </style>
</head>
<body>

<div id="auth-screen" class="section active" style="text-align:center; padding-top:100px;">
    <h1 style="color:var(--main)">DARKSHELL</h1>
    <input type="text" id="reg-name" placeholder="اسمك"><br><br>
    <input type="email" id="reg-email" placeholder="جيميلك"><br><br>
    <button onclick="register()" style="width:200px">دخول النظام</button>
</div>

<div id="section-group" class="section">
    <div id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="chat-input" placeholder="اكتب رسالة...">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<div id="section-profile" class="section">
    <div class="profile-card">
        <h2 id="u-display-name">جاري التحميل...</h2>
        <p>ID: <span id="u-id" style="color:yellow"></span></p>
        <div style="display:flex; justify-content:space-around; margin-top:20px;">
            <div>رصيدك<br><b id="u-coins">0</b> 💰</div>
            <div>إحالات<br><b id="u-ref">0</b> 👥</div>
        </div>
        <hr style="border:0.1px solid #333; margin:20px 0;">
        <p>رابط الإحالة الخاص بك:</p>
        <input type="text" id="ref-link" readonly style="font-size:10px; text-align:center; background:#000;">
    </div>
</div>

<div class="navbar" id="main-nav" style="display:none">
    <div class="nav-item" onclick="switchSec('group', this)"><i class="fa-solid fa-comments"></i><br>الشات</div>
    <div class="nav-item active" onclick="switchSec('profile', this)"><i class="fa-solid fa-user"></i><br>البروفايل</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDnojL76ZhOaeVg5-0O5WdBwMUtAjfrJKU",
        authDomain: "chat-43dea.firebaseapp.com",
        databaseURL: "https://chat-43dea-default-rtdb.firebaseio.com",
        projectId: "chat-43dea",
        storageBucket: "chat-43dea.firebasestorage.app",
        messagingSenderId: "827475356002",
        appId: "1:827475356002:web:ffdb5140d02ab1e237e43b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myID = localStorage.getItem('chat_uid');

    function register() {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        if(!name || !email) return alert("أكمل البيانات");
        const id = "U" + Math.floor(1000 + Math.random() * 9000);
        const refBy = new URLSearchParams(window.location.search).get('ref');

        db.ref('users/' + id).set({
            username: name, email: email, coins: 10, refCount: 0, status: 'pending', verified: false, id: id
        }).then(() => {
            if(refBy && refBy !== id) {
                db.ref('users/' + refBy + '/coins').transaction(c => (c || 0) + 10);
                db.ref('users/' + refBy + '/refCount').transaction(r => (r || 0) + 1);
            }
            localStorage.setItem('chat_uid', id);
            localStorage.setItem('username', name);
            location.reload();
        });
    }

    if(myID) {
        document.getElementById('auth-screen').classList.remove('active');
        document.getElementById('main-nav').style.display = 'flex';
        document.getElementById('section-profile').classList.add('active');
        loadData();
        loadMessages();
        listenGlobal();
    }

    function loadData() {
        db.ref('users/' + myID).on('value', snap => {
            const d = snap.val();
            if(!d) return;
            if(d.banned) { document.body.innerHTML = "<h2 style='text-align:center; color:red; margin-top:100px;'>🚫 حسابك محظور</h2>"; return; }
            const vIcon = d.verified ? ' <i class="fa-solid fa-circle-check" style="color:#3897f0;"></i>' : '';
            document.getElementById('u-display-name').innerHTML = d.username + vIcon;
            document.getElementById('u-id').innerText = myID;
            document.getElementById('u-coins').innerText = d.coins;
            document.getElementById('u-ref').innerText = d.refCount;
            document.getElementById('ref-link').value = window.location.href.split('?')[0] + "?ref=" + myID;
        });
    }

    function sendMessage() {
        const text = document.getElementById('chat-input').value;
        if(!text) return;
        db.ref('users/' + myID + '/status').once('value', s => {
            if(s.val() !== 'active') return alert("انتظر تفعيل الأدمن");
            db.ref('groups/dark/messages').push({ senderID: myID, senderName: localStorage.getItem('username'), text: text });
            document.getElementById('chat-input').value = "";
        });
    }

    function loadMessages() {
        db.ref('groups/dark/messages').limitToLast(40).on('value', snap => {
            const box = document.getElementById('chat-box');
            box.innerHTML = "";
            snap.forEach(c => {
                const m = c.val();
                const type = m.senderID === myID ? 'sent' : 'received';
                db.ref('users/' + m.senderID + '/verified').once('value', v => {
                    const check = v.val() ? ' <i class="fa-solid fa-circle-check verified-badge"></i>' : '';
                    box.innerHTML += `<div class="msg ${type}"><b>${m.senderName}</b>${check}<br>${m.text}</div>`;
                    box.scrollTop = box.scrollHeight;
                });
            });
        });
    }

    function listenGlobal() {
        db.ref('adminMessages/global').on('value', snap => {
            const m = snap.val();
            if(m && m.time > Date.now() - 5000) { // تنبيه فقط للرسائل الجديدة
                alert("📢 إشعار هام من الإدارة:\n" + m.message + (m.link ? "\nالرابط: " + m.link : ""));
            }
        });
    }

    function switchSec(s, el) {
        document.querySelectorAll('.section').forEach(x => x.classList.remove('active'));
        document.getElementById('section-' + s).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
